version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: her_area_postgres
    restart: always
    environment:
      POSTGRES_DB: her_area_db
      POSTGRES_USER: her_area_user
      POSTGRES_PASSWORD: her_area_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: python:3.12-slim
    container_name: her_area_django
    working_dir: /app
    command: bash -c "echo 'Django server readiness container idle waiting for API implementation phase...'; sleep infinity"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
